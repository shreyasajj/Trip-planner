services:
  app:
    build: .
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      MQTT_URL: mqtt://mosquitto:1883
      # FLIGHT_API_PROVIDER: aerodatabox
      # FLIGHT_API_KEY: your-rapidapi-key
      # ANTHROPIC_API_KEY: sk-ant-...          # receipt scanning
      # OIDC_ISSUER_URL: https://auth.example.com/application/o/trip/
      # OIDC_CLIENT_ID: trip-planner
      # OIDC_CLIENT_SECRET: "..."
      # PUBLIC_URL: https://trip.example.com
    volumes:
      - trip-data:/data
    depends_on:
      - mosquitto

  # Bundled Mosquitto broker. Expose 1883 to your LAN so phones can publish;
  # if the broker is reachable from the internet, enable auth + TLS first.
  mosquitto:
    image: eclipse-mosquitto:2
    restart: unless-stopped
    ports:
      - "1883:1883"
    volumes:
      - ./mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
      - mosquitto-data:/mosquitto/data

volumes:
  trip-data:
  mosquitto-data:
